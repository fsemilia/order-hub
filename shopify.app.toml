# Shopify app configuration (Shopify CLI: `shopify app config link` / `shopify app deploy`).
# Order Hub is a standalone (non-embedded) app: Shopify only pushes webhooks to it.
# Docs: https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration

name = "Order Hub"
client_id = "REPLACE_WITH_YOUR_CLIENT_ID"
application_url = "https://order-hub.vercel.app"
embedded = false

[access_scopes]
# read_customers is protected customer data: enable "Protected customer data access"
# (name, email, phone) in the Partner/Dev Dashboard for webhooks to include customer fields.
scopes = "read_orders,read_customers"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [
    "orders/create",
    "orders/updated",
    "orders/paid",
    "orders/cancelled",
    "customers/create",
    "customers/update",
  ]
  uri = "https://order-hub.vercel.app/api/webhooks/shopify"

  # Mandatory privacy (GDPR/LGPD) compliance webhooks
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact", "customers/data_request", "shop/redact"]
  uri = "https://order-hub.vercel.app/api/webhooks/shopify"

[auth]
redirect_urls = ["https://order-hub.vercel.app/api/auth/callback"]

[pos]
embedded = false
